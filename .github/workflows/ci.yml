name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.22.0

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $rules = @{
            PSUseApprovedVerbs       = 'Error'
            PSUseDeclaredVarsMoreThanAssignments = 'Warning'
            PSAvoidUsingWriteHost    = 'Warning'
            PSAvoidUsingEmptyCatchBlock = 'Warning'
            PSAvoidUsingPositionalParameters = 'Warning'
            PSAvoidGlobalAliases     = 'Warning'
            PSUseSingularNouns      = 'Warning'
            PSUseToExportFunctionsInManifest = 'Information'
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSUseToExportFunctionsInManifest -Severity Error
          if ($results) {
            Write-Host "::error::PSScriptAnalyzer found $($results.Count) error(s)"
            $results | ForEach-Object {
              Write-Host "::$($_.Severity.ToLower()):: $($_.ScriptName):$($_.Line) – $($_.Message)"
            }
            exit 1
          }
          Write-Host "No errors found."
